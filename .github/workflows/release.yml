name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.2)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-linux:
    name: Build & Package Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            gcc \
            pkg-config \
            fakeroot \
            dpkg-dev \
            libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(git describe --tags --always 2>/dev/null || echo "1.0.0")
            VERSION="${VERSION#v}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Build binary
        run: |
          wails build -tags webkit2_41 -o omnipack

      # ── Release tar.gz ──────────────────────────────────────────────────────
      - name: Create release archive
        run: make release-tar VERSION=${{ steps.version.outputs.VERSION }}

      # ── .deb package ────────────────────────────────────────────────────────
      - name: Build .deb package
        run: bash dist/build_deb.sh ${{ steps.version.outputs.VERSION }}

      # ── AppImage ────────────────────────────────────────────────────────────
      - name: Build AppImage
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          curl -fsSL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -o appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          bash dist/build_appimage.sh ${{ steps.version.outputs.VERSION }}

      # ── Stage Release Packages ──────────────────────────────────────────────
      - name: Prepare release packages and checksums
        run: |
          mkdir -p dist/packages
          cp dist/release/omnipack-${{ steps.version.outputs.VERSION }}-linux-x86_64.tar.gz dist/packages/
          cp omnipack_${{ steps.version.outputs.VERSION }}_amd64.deb dist/packages/
          cp omnipack-${{ steps.version.outputs.VERSION }}-x86_64.AppImage dist/packages/
          cp install.sh dist/packages/
          cd dist/packages
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload Release Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnipack-${{ steps.version.outputs.VERSION }}-linux-packages
          path: dist/packages/*

      # ── GitHub Release ───────────────────────────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          name: "Omnipack ${{ steps.version.outputs.TAG_NAME }}"
          draft: false
          prerelease: false
          body: |
            ## Omnipack ${{ steps.version.outputs.TAG_NAME }}

            Universal Linux Application & Package Manager

            ### Install Options

            **One-line installer (any distro):**
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.TAG_NAME }}/install.sh | bash
            ```

            **Arch Linux (AUR):**
            ```bash
            yay -S omnipack
            ```

            **Debian / Ubuntu (.deb):**
            ```bash
            sudo dpkg -i omnipack_${{ steps.version.outputs.VERSION }}_amd64.deb
            ```

            **AppImage (any distro, portable):**
            ```bash
            chmod +x omnipack-${{ steps.version.outputs.VERSION }}-x86_64.AppImage
            ./omnipack-${{ steps.version.outputs.VERSION }}-x86_64.AppImage
            ```

            ### System Requirements
            - Linux x86_64
            - `webkit2gtk-4.1` or `webkit2gtk-4.0` (GTK WebKit)
            - `gtk3`

            ### Checksums
            See `checksums.txt` in release assets.

          files: dist/packages/*
