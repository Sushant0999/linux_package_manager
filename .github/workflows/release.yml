name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build & Package Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            gcc \
            pkg-config \
            fakeroot \
            dpkg-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build binary
        run: wails build -tags webkit2_41 -o omnipack

      # ── Release tar.gz ──────────────────────────────────────────────────────
      - name: Create release archive
        run: make release-tar VERSION=${{ steps.version.outputs.VERSION }}

      # ── .deb package ────────────────────────────────────────────────────────
      - name: Build .deb package
        run: bash dist/build_deb.sh ${{ steps.version.outputs.VERSION }}

      # ── AppImage ────────────────────────────────────────────────────────────
      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/latest/download/appimagetool-x86_64.AppImage \
            -O appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          bash dist/build_appimage.sh ${{ steps.version.outputs.VERSION }}

      # ── Generate checksums ───────────────────────────────────────────────────
      - name: Generate checksums
        run: |
          sha256sum \
            dist/release/omnipack-${{ steps.version.outputs.VERSION }}-linux-x86_64.tar.gz \
            omnipack_${{ steps.version.outputs.VERSION }}_amd64.deb \
            omnipack-${{ steps.version.outputs.VERSION }}-x86_64.AppImage \
          > checksums.txt
          cat checksums.txt

      # ── GitHub Release ───────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Omnipack ${{ github.ref_name }}"
          draft: false
          prerelease: false
          body: |
            ## Omnipack ${{ github.ref_name }}

            Universal Linux Application & Package Manager

            ### Install Options

            **One-line installer (any distro):**
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.sh | bash
            ```

            **Arch Linux (AUR):**
            ```bash
            yay -S omnipack
            ```

            **Debian / Ubuntu:**
            ```bash
            sudo dpkg -i omnipack_${{ steps.version.outputs.VERSION }}_amd64.deb
            ```

            **AppImage (any distro, portable):**
            ```bash
            chmod +x omnipack-${{ steps.version.outputs.VERSION }}-x86_64.AppImage
            ./omnipack-${{ steps.version.outputs.VERSION }}-x86_64.AppImage
            ```

            ### System Requirements
            - Linux x86_64
            - `webkit2gtk-4.1` or `webkit2gtk-4.0` (GTK WebKit)
            - `gtk3`

            ### Checksums
            See `checksums.txt` in release assets.

          files: |
            dist/release/omnipack-${{ steps.version.outputs.VERSION }}-linux-x86_64.tar.gz
            dist/release/omnipack-${{ steps.version.outputs.VERSION }}-linux-x86_64.tar.gz.sha256
            omnipack_${{ steps.version.outputs.VERSION }}_amd64.deb
            omnipack-${{ steps.version.outputs.VERSION }}-x86_64.AppImage
            checksums.txt
            install.sh
